name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Copy rules
        run: ./gradlew checkCopy

      - name: Core logic tests
        run: ./gradlew :core:domain:test

      - name: Data layer tests
        run: ./gradlew :core:data:testDebugUnitTest

      - name: App UI tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: the-last-hit-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  # The shrunk release APK and bundle, once the checks above pass on main. They're signed with the
  # upload key when its secrets are set, and with this run's own debug key when none are, which
  # Play won't accept. With only some of the secrets set, the job fails. See docs/RELEASE.md.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LASTHIT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LASTHIT_UPLOAD_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # With none of the secrets, the build goes on with the debug key. With only some of them it
      # stops here, so a half-set or misnamed secret can't pass as a debug-signed "release".
      - name: Decode the upload key
        env:
          LASTHIT_UPLOAD_STORE_PASSWORD: ${{ secrets.LASTHIT_UPLOAD_STORE_PASSWORD }}
          LASTHIT_UPLOAD_KEY_ALIAS: ${{ secrets.LASTHIT_UPLOAD_KEY_ALIAS }}
          LASTHIT_UPLOAD_KEY_PASSWORD: ${{ secrets.LASTHIT_UPLOAD_KEY_PASSWORD }}
        run: |
          names="LASTHIT_UPLOAD_KEYSTORE_BASE64 LASTHIT_UPLOAD_STORE_PASSWORD LASTHIT_UPLOAD_KEY_ALIAS LASTHIT_UPLOAD_KEY_PASSWORD"
          found=0
          missing=""
          for name in $names; do
            value="${!name}"
            if [ -n "${value//[[:space:]]/}" ]; then found=$((found + 1)); else missing="$missing $name"; fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No upload key secrets, so the release build is signed with this run's debug key."
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Only some of the upload key secrets are set. Missing:$missing. Add all four, or remove them all to sign with the debug key. See docs/RELEASE.md."
            exit 1
          fi
          printf '%s' "$LASTHIT_UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "LASTHIT_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release APK and bundle
        env:
          LASTHIT_UPLOAD_STORE_PASSWORD: ${{ secrets.LASTHIT_UPLOAD_STORE_PASSWORD }}
          LASTHIT_UPLOAD_KEY_ALIAS: ${{ secrets.LASTHIT_UPLOAD_KEY_ALIAS }}
          LASTHIT_UPLOAD_KEY_PASSWORD: ${{ secrets.LASTHIT_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:checkReleaseResources

      # Before the upload, so a build that should have had the upload key and didn't fails without
      # leaving an artefact behind.
      - name: Say which key signed it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          signer="$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -m 1 'certificate DN' || true)"
          if [ -z "$signer" ]; then
            echo "Couldn't read the APK's signature." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$signer" | grep -q 'CN=Android Debug'; then
            echo "Signed with this run's debug key, not the upload key: fine for a test install, not for Play." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signed with the upload key: ${signer#*: }" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The decode step set the keystore's path only when all the secrets were there.
          if [ -n "$LASTHIT_UPLOAD_STORE_FILE" ]; then
            echo "::error::The upload key secrets are set, but the APK isn't signed with the upload key."
            exit 1
          fi

      - name: Upload release APK and bundle
        uses: actions/upload-artifact@v6
        with:
          name: the-last-hit-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
