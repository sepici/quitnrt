name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Copy rules
        run: ./gradlew checkCopy

      - name: Core logic tests
        run: ./gradlew :core:domain:test

      - name: Data layer tests
        run: ./gradlew :core:data:testDebugUnitTest

      - name: App UI tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: the-last-hit-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  # The shrunk release APK and bundle, once the checks above pass on main. They're signed with the
  # upload key when its secrets are set, and with this run's own debug key otherwise, which Play
  # won't accept. See docs/RELEASE.md.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LASTHIT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LASTHIT_UPLOAD_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the upload key
        if: env.LASTHIT_UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$LASTHIT_UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "LASTHIT_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release APK and bundle
        env:
          LASTHIT_UPLOAD_STORE_PASSWORD: ${{ secrets.LASTHIT_UPLOAD_STORE_PASSWORD }}
          LASTHIT_UPLOAD_KEY_ALIAS: ${{ secrets.LASTHIT_UPLOAD_KEY_ALIAS }}
          LASTHIT_UPLOAD_KEY_PASSWORD: ${{ secrets.LASTHIT_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:checkReleaseResources

      - name: Upload release APK and bundle
        uses: actions/upload-artifact@v6
        with:
          name: the-last-hit-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Say which key signed it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          signer="$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -m 1 'certificate DN' || true)"
          if [ -z "$signer" ]; then
            echo "Couldn't read the APK's signature." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$signer" | grep -q 'CN=Android Debug'; then
            echo "Signed with this run's debug key, not the upload key: fine for a test install, not for Play." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signed with the upload key: ${signer#*: }" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
