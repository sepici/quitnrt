<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>Fieldbook, Lair</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="status"><span class="num">15:05</span>
  <svg width="52" height="14" viewBox="0 0 52 14" fill="currentColor"><path d="M1 13h2v-3H1zM5 13h2V7H5zM9 13h2V4H9zM13 13h2V1h-2z"/><rect x="30.5" y="2.5" width="17" height="9" rx="2" fill="none" stroke="currentColor"/><rect x="32" y="4" width="11" height="6"/><rect x="49" y="5" width="2" height="4"/></svg>
</div>

<header class="appbar">
  <div><div class="eyebrow">Week 4 of 12</div><h1>Lair</h1></div>
  <a class="iconbtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><rect x="13" y="5" width="5" height="4" rx="1"/><rect x="7" y="15" width="5" height="4" rx="1"/></svg></a>
</header>

<main style="gap:20px">
  <figure>
    <div class="plate">
      <picture>
        <source srcset="backdrop-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="backdrop-light.svg" alt="">
      </picture>
      <div class="sprite-slot"><img src="creature.png" alt="Gary, a dragon" width="192" height="192" style="image-rendering:pixelated" onerror="this.style.visibility='hidden'"></div>
    </div>
    <figcaption class="caption">Gary eyes you from the rocks.</figcaption>
  </figure>

  <section>
    <div class="nameblock">
      <div><h2>Gary</h2><div class="lab">Dragon</div></div>
      <span class="px">100/120&nbsp;HP</span>
    </div>
    <div class="hp big" role="img" aria-label="100 of 120 HP"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></div>
  </section>

  <dl>
    <div><dt>Banked hits</dt><dd><span class="px">1</span></dd></div>
    <div><dt>Gear</dt><dd class="gear"><img src="gear-wooden-sword.svg" alt="">Wooden sword <a class="link" style="font-size:14px;margin-left:4px">Change</a></dd></div>
  </dl>

  <div class="actions">
    <button class="primary" style="margin:0;height:56px;font-size:17px">Hit</button>
    <button class="disabled" disabled>5× attack<em>Needs 5&nbsp;hits</em></button>
  </div>
</main>

<nav>
  <a><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/><rect x="11" y="13" width="3" height="3" rx=".5"/></svg><span>Today</span></a>
  <a><svg class="i" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4 7h1M4 12h1M4 17h1"/></svg><span>History</span></a>
  <a><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16V9"/></svg><span>Insights</span></a>
  <a><svg class="i" viewBox="0 0 24 24"><path d="M3 6h5v5h5v5h8"/></svg><span>Plan</span></a>
  <a class="on"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h18M5 20v-6a7 7 0 0 1 14 0v6M10 20v-3a2 2 0 0 1 4 0v3"/></svg><span>Lair</span></a>
</nav>
</body>
</html>
